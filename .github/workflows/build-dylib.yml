name: Build LongmaoPlus dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDKVER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK $SDKVER -> $SDKPATH"
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          sudo mkdir -p /opt/theos/sdks
          sudo ln -sfn "$SDKPATH" "/opt/theos/sdks/iPhoneOS${SDKVER}.sdk"
          sudo chown -R "$(whoami)" /opt/theos
          echo "THEOS=/opt/theos" >> "$GITHUB_ENV"
          ls -l /opt/theos/sdks

      - name: Install ldid
        run: brew install ldid || true

      - name: Build dylib
        run: |
          set -e
          cd tweak
          make clean || true
          make -j4 2>&1 | tail -80
          echo "---- artifacts ----"
          find . -name '*.dylib' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: LongmaoPlus_dylib
          path: tweak/.theos/obj/**/*.dylib
          if-no-files-found: error
          retention-days: 14
