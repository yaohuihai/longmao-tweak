name: Build LongmaoPlus dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld git file
          clang --version | head -2
          ls -l /usr/bin/ld64.lld /usr/bin/ld.lld 2>/dev/null || true

      - name: Fetch iPhoneOS SDK
        run: |
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          echo "SDK=$PWD/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
          du -sh iPhoneOS16.5.sdk
          ls iPhoneOS16.5.sdk/usr/lib/libSystem.tbd

      - name: Compile dylib
        run: |
          set -x
          cd tweak
          clang -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc -fblocks -O2 -dynamiclib \
            -fuse-ld=/usr/bin/ld64.lld \
            -framework Foundation -framework UIKit \
            -Wl,-install_name,@executable_path/LongmaoPlus.dylib \
            -o LongmaoPlus.dylib LongmaoPlus.m
          file LongmaoPlus.dylib
          ls -lh LongmaoPlus.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: LongmaoPlus_dylib
          path: tweak/LongmaoPlus.dylib
          if-no-files-found: error
