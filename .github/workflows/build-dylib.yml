name: Build LongmaoPlus dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld git file
          clang --version | head -2
          ls -l /usr/bin/ld.lld* || true
          sudo ln -sf "$(readlink -f /usr/bin/ld.lld)" /usr/bin/ld64.lld
          ld64.lld --version || true

      - name: Fetch iPhoneOS SDK
        run: |
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          echo "SDK=$PWD/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
          du -sh iPhoneOS16.5.sdk

      - name: Compile dylib
        run: |
          set -eux
          cd tweak
          FLAGS="-target arm64-apple-ios15.0 -isysroot $SDK -fobjc-arc -fblocks -O2 -dynamiclib -fuse-ld=lld -framework Foundation -framework UIKit -framework CoreGraphics -framework Security"
          clang $FLAGS -Wl,-install_name,@executable_path/LongmaoPlus.dylib -o LongmaoPlus.dylib LongmaoPlus.m
          clang $FLAGS -Wl,-install_name,@executable_path/Frameworks/LongmaoPlus.dylib -o LongmaoPlus_Frameworks.dylib LongmaoPlus.m
          file LongmaoPlus.dylib LongmaoPlus_Frameworks.dylib
          ls -lh *.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: LongmaoPlus_dylib
          path: tweak/*.dylib
          if-no-files-found: error
